[pytest]
# ── Test discovery ───────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Markers ──────────────────────────────────────────────────────────────────
markers =
    integration: requires a running local LLM server (pass --run-integration to enable)
    slow: takes more than a few seconds (skipped in fast mode)

# ── Output ───────────────────────────────────────────────────────────────────
# -v         verbose test names
# -p no:warnings  suppress noisy import warnings from langchain/chromadb
addopts = -v -p no:warnings --tb=short

# ── Timeouts (requires pytest-timeout) ───────────────────────────────────────
# timeout = 60

# ── Logging ─────────────────────────────────────────────────────────────────
log_cli = false
log_level = WARNING
